# ── Serialización JSON ────────────────────────────────────────────────────────
# Requirement 5.8: las propiedades no declaradas en CotizacionRequest se ignoran
# y no producen 400. Es el default de Spring Boot, pero se fija explícitamente
# para que el comportamiento no dependa de la versión del framework.
spring.jackson.deserialization.fail-on-unknown-properties=false

# Requirement 3.7: fechaCreacion se serializa como cadena ISO 8601 UTC desde el
# mapper, nunca como timestamp numérico.
spring.jackson.serialization.write-dates-as-timestamps=false

# ── Servidor ──────────────────────────────────────────────────────────────────
# El contrato OpenAPI declara http://localhost:8080 como servidor de desarrollo.
server.port=8080

# No se exponen endpoints adicionales a los tres del contrato: sin página de
# error de Whitelabel con detalle interno.
server.error.include-stacktrace=never
server.error.include-message=never
