# ============================================================
# Configuración de Nginx – Taller DAE
# Sirve el frontend estático y actúa como reverse proxy
# hacia el backend Spring Boot en /api/
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # .mjs (ES module files) no está en el mime.types estándar de nginx:alpine.
    # Se añade explícitamente para que los navegadores acepten ES modules.
    types {
        application/javascript  mjs;
    }

    sendfile        on;
    keepalive_timeout 65;

    # ── Logging ──────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Upstream: backend Spring Boot ────────────────────────
    # "backend" es el nombre del servicio definido en docker-compose.yml
    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # ── Contenido estático (frontend) ─────────────────────
        root   /usr/share/nginx/html;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Proxy inverso hacia el backend ────────────────────
        # Todas las rutas /api/* se reenvían al contenedor backend.
        # El puerto 8080 del backend NO está expuesto al host.
        location /api/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Páginas de error ──────────────────────────────────
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
