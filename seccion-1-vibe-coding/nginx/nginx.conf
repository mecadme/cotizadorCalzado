# ============================================================
# Configuración de Nginx – Taller DAE
# Sirve contenido estático y está preparado para actuar
# como reverse proxy hacia un backend en el futuro.
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # ── Logging ──────────────────────────────────────────────
    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log warn;

    # ── Upstream (descomentar cuando exista el backend) ──────
    # upstream backend {
    #     server backend:3000;   # nombre del servicio en docker-compose
    # }

    server {
        listen 80;
        server_name localhost;

        # ── Contenido estático ────────────────────────────────
        root   /usr/share/nginx/html;
        index  index.html;

        location / {
            try_files $uri $uri/ =404;
        }

        # ── Proxy hacia el backend (descomentar cuando esté listo) ──
        # location /api/ {
        #     proxy_pass         http://backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header   Upgrade $http_upgrade;
        #     proxy_set_header   Connection 'upgrade';
        #     proxy_set_header   Host $host;
        #     proxy_set_header   X-Real-IP $remote_addr;
        #     proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_cache_bypass $http_upgrade;
        # }

        # ── Páginas de error personalizadas ──────────────────
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
