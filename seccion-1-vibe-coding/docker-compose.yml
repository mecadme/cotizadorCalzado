# ============================================================
# Docker Compose – Ambiente de Desarrollo Taller DAE
# Uso: docker compose up -d
# ============================================================

services:

  # ── Base de datos MySQL 8 ────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: tallerdae-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${MYSQL_DATABASE}
      MYSQL_USER:          ${MYSQL_USER}
      MYSQL_PASSWORD:      ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tallerdae-net

  # ── Backend Spring Boot ───────────────────────────────────
  # Puerto 8080 NO expuesto al host; solo accesible dentro de la red interna.
  # Nginx reenvía /api/* hacia este servicio via upstream "backend".
  backend:
    build:
      context: ../seccion-2-spec-driven-back   # ruta relativa al Dockerfile
      dockerfile: Dockerfile
    container_name: tallerdae-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL:      jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    # Sin "ports": el puerto 8080 permanece interno a la red Docker
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tallerdae-net

  # ── Servidor web Nginx ───────────────────────────────────
  # Sirve el frontend estático y hace proxy inverso al backend en /api/
  nginx:
    image: nginx:alpine
    container_name: tallerdae-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro              # configuración principal
      - ../seccion-2-spec-driven-front:/usr/share/nginx/html:ro  # frontend estático
      - ./nginx/logs:/var/log/nginx                              # logs accesibles desde el host
    depends_on:
      - backend
    networks:
      - tallerdae-net

# ── Volúmenes ────────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ── Red interna ──────────────────────────────────────────
networks:
  tallerdae-net:
    driver: bridge
