openapi: 3.0.3

info:
  title: Cotizador de Reparación de Calzado — API
  description: |
    Servicio REST para consultar el catálogo de tipos de calzado y de reparación,
    y generar cotizaciones estimadas de costo y tiempo de entrega.

    ## Reglas de negocio reflejadas en el contrato

    - `subtotal = redondear(Σ(precioBase_i × factorComplejidad), 2, HALF_UP)`, donde `i` recorre
      **cada aparición** de `tipoReparacionIds` (los ids repetidos suman su aporte tantas veces
      como aparezcan).
    - Cotización normal (`urgente` en `false`, `null` o ausente): `recargoUrgencia = 0.00`,
      `total = subtotal`, `tiempoEstimadoDias = max(tiempoEstimadoDias_i)`.
    - Cotización urgente (`urgente = true`): `recargoUrgencia = redondear(subtotal × 0.30, 2, HALF_UP)`,
      `total = subtotal + recargoUrgencia`, `tiempoEstimadoDias = max(1, ceil(max(tiempoEstimadoDias_i) / 2))`.
    - Todos los montos se expresan con 2 decimales en la moneda `USD`.

    ## Endpoints inexistentes

    No hay `GET /api/cotizaciones/{id}`: la cotización se persiste internamente pero no se publica.

    ## Manejo de errores

    Toda solicitud inválida responde `400` con `application/problem+json` (RFC 7807).
    No existe `503`: el repositorio vive en memoria dentro del mismo proceso.
  version: 1.0.0

# La API no requiere autenticación: `security: []` lo declara explícitamente.
security: []

servers:
  - url: http://localhost:8080
    description: Entorno local de desarrollo

tags:
  - name: Catálogo
    description: Consulta de tipos de calzado y tipos de reparación disponibles.
  - name: Cotizaciones
    description: Generación de cotizaciones de costo y tiempo de entrega.

paths:

  /api/tipos-calzado:
    get:
      tags: [Catálogo]
      summary: Lista los tipos de calzado disponibles
      description: |
        Devuelve el catálogo completo de tipos de calzado ordenado ascendentemente por `nombre`.
        El orden usa colación del español ignorando mayúsculas y acentos, no comparación binaria:
        por eso `Zapatilla deportiva` precede a `Zapato formal`.
        Si el catálogo está vacío responde `200` con un arreglo vacío (nunca `404`).
      operationId: getTiposCalzado
      responses:
        '200':
          description: Catálogo de tipos de calzado, ordenado por `nombre` ASC.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoCalzado'
              examples:
                catalogoSemilla:
                  summary: Catálogo semilla (3 elementos)
                  value:
                    - id: "2"
                      nombre: "Bota de cuero"
                      factorComplejidad: 1.5
                    - id: "3"
                      nombre: "Zapatilla deportiva"
                      factorComplejidad: 1.0
                    - id: "1"
                      nombre: "Zapato formal"
                      factorComplejidad: 1.2
                catalogoVacio:
                  summary: Catálogo vacío
                  value: []

  /api/tipos-reparacion:
    get:
      tags: [Catálogo]
      summary: Lista los tipos de reparación disponibles
      description: |
        Devuelve el catálogo completo de tipos de reparación ordenado ascendentemente por `nombre`.
        El orden usa colación del español ignorando mayúsculas y acentos, no comparación binaria:
        por eso `Cambio de suela` precede a `Cambio de tacón`.
        Si el catálogo está vacío responde `200` con un arreglo vacío (nunca `404`).
      operationId: getTiposReparacion
      responses:
        '200':
          description: Catálogo de tipos de reparación, ordenado por `nombre` ASC.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoReparacion'
              examples:
                catalogoSemilla:
                  summary: Catálogo semilla (4 elementos)
                  value:
                    - id: "2"
                      nombre: "Cambio de suela"
                      precioBase: 20.00
                      tiempoEstimadoDias: 4
                    - id: "1"
                      nombre: "Cambio de tacón"
                      precioBase: 12.00
                      tiempoEstimadoDias: 2
                    - id: "3"
                      nombre: "Cosido de costura"
                      precioBase: 8.00
                      tiempoEstimadoDias: 1
                    - id: "4"
                      nombre: "Limpieza y tinturado"
                      precioBase: 10.00
                      tiempoEstimadoDias: 3
                catalogoVacio:
                  summary: Catálogo vacío
                  value: []

  /api/cotizaciones:
    post:
      tags: [Cotizaciones]
      summary: Genera una cotización
      description: |
        Calcula costo y tiempo de entrega para una combinación de tipo de calzado y
        tipos de reparación, y persiste el resultado internamente.

        La validación es **acumulativa**: si la solicitud presenta varias causas de error, la
        respuesta reúne todas las violaciones en `errors`, mientras `type`, `title` y `detail`
        corresponden a la de mayor precedencia según este orden:

        1. `reparaciones-requeridas`
        2. `tipo-calzado-no-encontrado`
        3. `tipo-reparacion-no-encontrado`
        4. `solicitud-malformada`
      operationId: crearCotizacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizacionRequest'
            examples:
              normal:
                summary: Cotización normal
                value:
                  tipoCalzadoId: "1"
                  tipoReparacionIds: ["1", "3"]
                  urgente: false
              urgente:
                summary: Cotización urgente
                value:
                  tipoCalzadoId: "2"
                  tipoReparacionIds: ["2"]
                  urgente: true
              conRepetidos:
                summary: Reparación repetida (suma dos veces)
                value:
                  tipoCalzadoId: "3"
                  tipoReparacionIds: ["1", "1"]
              multiplesReparaciones:
                summary: Varias reparaciones (escenario 3 del Anexo C)
                value:
                  tipoCalzadoId: "3"
                  tipoReparacionIds: ["3", "4"]
                  urgente: false
              sinUrgente:
                summary: Campo `urgente` omitido (se asume normal)
                value:
                  tipoCalzadoId: "1"
                  tipoReparacionIds: ["4"]
      responses:
        '201':
          description: Cotización generada y persistida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionResponse'
              examples:
                normal:
                  summary: Zapato formal (1.2) + tacón (12.00) + costura (8.00)
                  value:
                    id: "3f2a7c18-9b4e-4d21-8a55-1c0e7b93da62"
                    subtotal: 24.00
                    recargoUrgencia: 0.00
                    total: 24.00
                    moneda: "USD"
                    tiempoEstimadoDias: 2
                    fechaCreacion: "2026-08-20T14:32:07Z"
                urgente:
                  summary: Bota de cuero (1.5) + suela (20.00), urgente
                  value:
                    id: "a1c94f0e-2d77-4b3a-9f61-58e2b7c04d13"
                    subtotal: 30.00
                    recargoUrgencia: 9.00
                    total: 39.00
                    moneda: "USD"
                    tiempoEstimadoDias: 2
                    fechaCreacion: "2026-08-20T14:35:11Z"
                multiplesReparaciones:
                  summary: >-
                    Zapatilla deportiva (1.0) + costura (8.00, 1 d) + tinturado (10.00, 3 d).
                    El tiempo es el máximo, no la suma.
                  value:
                    id: "b7e30d52-4a19-4c86-b0f4-6d21e9c37a08"
                    subtotal: 18.00
                    recargoUrgencia: 0.00
                    total: 18.00
                    moneda: "USD"
                    tiempoEstimadoDias: 3
                    fechaCreacion: "2026-08-20T14:38:02Z"
                conRepetidos:
                  summary: >-
                    Zapatilla deportiva (1.0) + tacón (12.00) repetido dos veces.
                    Cada aparición aporta su costo: 12.00 × 1.0 × 2 = 24.00.
                    El tiempo no se duplica: sigue siendo el máximo, 2 días.
                  value:
                    id: "c04b1f9a-8e63-4d70-a215-3f8c60b4e5d7"
                    subtotal: 24.00
                    recargoUrgencia: 0.00
                    total: 24.00
                    moneda: "USD"
                    tiempoEstimadoDias: 2
                    fechaCreacion: "2026-08-20T14:41:26Z"
        '400':
          $ref: '#/components/responses/SolicitudInvalida'

components:

  schemas:

    TipoCalzado:
      type: object
      description: Categoría de calzado del catálogo.
      required: [id, nombre, factorComplejidad]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Identificador único del tipo de calzado.
          example: "1"
        nombre:
          type: string
          minLength: 1
          description: Nombre descriptivo.
          example: "Zapato formal"
        factorComplejidad:
          type: number
          minimum: 0.5
          multipleOf: 0.01
          description: |
            Multiplicador aplicado al precio base de cada reparación.
            Mínimo `0.5`, con a lo sumo 2 decimales.
          example: 1.2

    TipoReparacion:
      type: object
      description: Servicio de reparación disponible en el catálogo.
      required: [id, nombre, precioBase, tiempoEstimadoDias]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Identificador único del tipo de reparación.
          example: "1"
        nombre:
          type: string
          minLength: 1
          description: Nombre del servicio.
          example: "Cambio de tacón"
        precioBase:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          description: Precio base en `USD`; mínimo `0.01`, con a lo sumo 2 decimales.
          example: 12.00
        tiempoEstimadoDias:
          type: integer
          format: int32
          minimum: 1
          description: Tiempo estimado del servicio en días; mínimo `1`.
          example: 2

    CotizacionRequest:
      type: object
      description: |
        Datos de entrada para generar una cotización.

        `tipoReparacionIds` admite ids repetidos: cada aparición aporta su costo al subtotal.

        Los campos desconocidos se ignoran silenciosamente (no producen `400`).
      required: [tipoCalzadoId, tipoReparacionIds]
      properties:
        tipoCalzadoId:
          type: string
          minLength: 1
          description: |
            Id de un tipo de calzado existente. Si es `null`, vacío o no existe en el catálogo,
            la respuesta es `400` con `type` `tipo-calzado-no-encontrado`. Cuando el valor está
            ausente, el `detail` pide el dato en lugar de reproducirlo, y `errors` no lleva
            `valoresInvalidos`.
          example: "1"
        tipoReparacionIds:
          type: array
          minItems: 1
          description: |
            Ids de tipos de reparación existentes, con repeticiones permitidas.
            Si es `null` o vacío, la respuesta es `400` con `type` `reparaciones-requeridas`;
            si algún id no existe, `type` `tipo-reparacion-no-encontrado`.
          items:
            type: string
            minLength: 1
          example: ["1", "3"]
        urgente:
          type: boolean
          nullable: true
          default: false
          description: |
            `true` aplica recargo de urgencia del 30 % y reduce el tiempo a la mitad
            (mínimo 1 día). `false`, `null` o ausente se tratan como cotización normal.
          example: false

    CotizacionResponse:
      type: object
      description: Resultado del cálculo de costo y tiempo de entrega.
      required:
        - id
        - subtotal
        - recargoUrgencia
        - total
        - moneda
        - tiempoEstimadoDias
        - fechaCreacion
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la cotización (UUID versión 4).
          example: "3f2a7c18-9b4e-4d21-8a55-1c0e7b93da62"
        subtotal:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          description: |
            `redondear(Σ(precioBase_i × factorComplejidad), 2, HALF_UP)` sobre cada aparición
            de `tipoReparacionIds`. Siempre mayor que cero, con 2 decimales.
          example: 24.00
        recargoUrgencia:
          type: number
          minimum: 0
          multipleOf: 0.01
          description: |
            `0.00` en cotizaciones normales; `redondear(subtotal × 0.30, 2, HALF_UP)`
            en cotizaciones urgentes.
          example: 0.00
        total:
          type: number
          minimum: 0.01
          multipleOf: 0.01
          description: '`subtotal + recargoUrgencia`, con 2 decimales.'
          example: 24.00
        moneda:
          type: string
          description: Código de moneda de todos los montos.
          enum: ["USD"]
          example: "USD"
        tiempoEstimadoDias:
          type: integer
          format: int32
          minimum: 1
          description: |
            `max(tiempoEstimadoDias_i)` en cotizaciones normales;
            `max(1, ceil(max(tiempoEstimadoDias_i) / 2))` en urgentes.
          example: 2
        fechaCreacion:
          type: string
          format: date-time
          description: Instante de creación en ISO 8601 UTC, truncado a segundos.
          example: "2026-08-20T14:32:07Z"

    ProblemDetails:
      type: object
      description: |
        Cuerpo de error conforme a RFC 7807. Nunca incluye stack traces.
      required: [type, title, status, detail]
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica la categoría del error.
          enum:
            - "https://api.cotizador/errors/reparaciones-requeridas"
            - "https://api.cotizador/errors/tipo-calzado-no-encontrado"
            - "https://api.cotizador/errors/tipo-reparacion-no-encontrado"
            - "https://api.cotizador/errors/solicitud-malformada"
          example: "https://api.cotizador/errors/tipo-reparacion-no-encontrado"
        title:
          type: string
          description: Resumen legible de la categoría del error.
          enum:
            - "Se requiere al menos una reparación"
            - "Tipo de calzado no encontrado"
            - "Tipo de reparación no encontrado"
            - "Solicitud malformada"
          example: "Tipo de reparación no encontrado"
        status:
          type: integer
          format: int32
          description: Código HTTP de la respuesta.
          enum: [400]
          example: 400
        detail:
          type: string
          description: Descripción específica de esta ocurrencia del error.
          example: "Tipos de reparación no encontrados: 99, 100"
        instance:
          type: string
          format: uri-reference
          description: Ruta de la solicitud que originó el error.
          example: "/api/cotizaciones"
        errors:
          type: array
          description: |
            Una entrada por cada violación detectada, en orden de precedencia.
            Se omite cuando no hay violaciones atribuibles a un campo concreto.
          items:
            $ref: '#/components/schemas/ViolacionCampo'

    ViolacionCampo:
      type: object
      description: Violación de validación asociada a un campo de la solicitud.
      required: [field]
      additionalProperties: false
      properties:
        field:
          type: string
          description: Nombre del campo que originó la violación.
          example: "tipoReparacionIds"
        valoresInvalidos:
          type: array
          minItems: 1
          description: |
            Valores que no pudieron resolverse, deduplicados y en orden de primera aparición.
            Se omite cuando el error no está ligado a valores concretos.
          items:
            type: string
          example: ["99", "100"]

  responses:

    SolicitudInvalida:
      description: |
        Solicitud inválida. `type` y `title` corresponden a la violación de mayor precedencia;
        `errors` reúne todas las violaciones detectadas.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
          examples:
            reparacionesRequeridas:
              summary: '`tipoReparacionIds` nulo o vacío'
              value:
                type: "https://api.cotizador/errors/reparaciones-requeridas"
                title: "Se requiere al menos una reparación"
                status: 400
                detail: "Se requiere seleccionar al menos una reparación"
                instance: "/api/cotizaciones"
                errors:
                  - field: "tipoReparacionIds"
            tipoCalzadoNoEncontrado:
              summary: '`tipoCalzadoId` inexistente'
              value:
                type: "https://api.cotizador/errors/tipo-calzado-no-encontrado"
                title: "Tipo de calzado no encontrado"
                status: 400
                detail: "Tipo de calzado no encontrado: 99"
                instance: "/api/cotizaciones"
                errors:
                  - field: "tipoCalzadoId"
                    valoresInvalidos: ["99"]
            tipoCalzadoAusente:
              summary: '`tipoCalzadoId` ausente, nulo o vacío'
              value:
                type: "https://api.cotizador/errors/tipo-calzado-no-encontrado"
                title: "Tipo de calzado no encontrado"
                status: 400
                detail: "Se requiere indicar el tipo de calzado"
                instance: "/api/cotizaciones"
                errors:
                  - field: "tipoCalzadoId"
            tipoReparacionNoEncontrado:
              summary: Uno o más ids de reparación inexistentes
              value:
                type: "https://api.cotizador/errors/tipo-reparacion-no-encontrado"
                title: "Tipo de reparación no encontrado"
                status: 400
                detail: "Tipos de reparación no encontrados: 99, 100"
                instance: "/api/cotizaciones"
                errors:
                  - field: "tipoReparacionIds"
                    valoresInvalidos: ["99", "100"]
            violacionesAcumuladas:
              summary: Varias violaciones simultáneas (precedencia + acumulación)
              value:
                type: "https://api.cotizador/errors/tipo-calzado-no-encontrado"
                title: "Tipo de calzado no encontrado"
                status: 400
                detail: "Tipo de calzado no encontrado: 99"
                instance: "/api/cotizaciones"
                errors:
                  - field: "tipoCalzadoId"
                    valoresInvalidos: ["99"]
                  - field: "tipoReparacionIds"
                    valoresInvalidos: ["77"]
            solicitudMalformada:
              summary: JSON inválido o tipo incompatible en un campo
              value:
                type: "https://api.cotizador/errors/solicitud-malformada"
                title: "Solicitud malformada"
                status: 400
                detail: "El cuerpo de la solicitud contiene un tipo incompatible en: urgente."
                instance: "/api/cotizaciones"
                errors:
                  - field: "urgente"
